# ConnectStats vhost inside the container. TLS terminates in front (Caddy) on the droplet.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    # The repo's .htaccess maps /foo -> foo.php; setup/.htaccess denies the setup dir.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bug report admin pages (they list reporters' emails): HTTP Basic auth.
    # On the old droplet this was an untracked bugreport/.htaccess. The password file
    # comes from CONFIG_DIR, never the repo; if it's missing Apache fails closed (500).
    <Directory /var/www/html/prod/bugreport>
        <FilesMatch "^(export|list)\.php$">
            AuthType Basic
            AuthName "List access"
            AuthUserFile /etc/connectstats/htpasswd
            Require valid-user
        </FilesMatch>
    </Directory>

    RedirectMatch 404 /\.git
    RedirectMatch 404 ^/[^/]+/docker/

    # Real client IP from the reverse proxy in front.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
