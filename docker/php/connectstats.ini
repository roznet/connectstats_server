; ConnectStats PHP settings (applies to Apache mod_php and the CLI used by the queue).
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Deprecations are hidden until the php-upgrade P1 items land.
error_reporting = E_ALL & ~E_DEPRECATED

; Bug report zips and FIT uploads.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120

; The queue starts workers and tasks with exec(); keep it available.
disable_functions =

; config.php / config_bugreport.php are mounted in /etc/connectstats, never in the image.
; It comes first so a stray config.php in a bind-mounted checkout can't shadow it.
include_path = "/etc/connectstats:.:/usr/local/lib/php"

date.timezone = UTC
expose_php = Off
