# ConnectStats stack: app (Apache + mod_php), worker (queue + scheduled jobs), db (MySQL 8.4).
#
# Production shape: code is baked into the image; config and data come from the host.
#   CONFIG_DIR  config.php, config_bugreport.php, APNs .p8 key (secrets, never in the image)
#   DATA_DIR    persistent data: mysql/, bugs/, state/  (droplet: /mnt/connectstats_data)
#   LOG_DIR     per-task logs and cron logs, 15-day cleanup (droplet: on the Volume too)
# All app processes and MySQL run as APP_UID:APP_GID (2000, host user/group dockerapp).
# tmp (scratch + S3 read cache) is a named volume on the root disk: safe to lose.
#
# Local development: cp .env.sample .env, which also enables docker-compose.dev.yml
# (live code, Garmin mock, test runner). See docker/README.md.

name: connectstats

# Outgoing email (bug report notifications) through the Resend HTTP API.
x-email-env: &email-env
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}

x-app: &app
  environment:
    <<: *email-env
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      APP_UID: ${APP_UID:-2000}
      APP_GID: ${APP_GID:-2000}
  image: connectstats-app:${IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    # config.php + config_bugreport.php, found through PHP's include_path (docker/php/connectstats.ini)
    - ${CONFIG_DIR:?set CONFIG_DIR}:/etc/connectstats:ro
    - ${DATA_DIR:?set DATA_DIR}/bugs:/var/www/bugs
    - ${DATA_DIR}/state:/var/www/state
    - ${LOG_DIR:?set LOG_DIR}:/var/www/log
    - tmp:/var/www/tmp

services:
  db:
    build: docker/mysql
    image: connectstats-db:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Datadir owned by dockerapp on the host, like the rest of the Volume.
    user: "${APP_UID:-2000}:${APP_GID:-2000}"
    command: --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-256M}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      CS_DB_USER: ${CS_DB_USER:?set CS_DB_USER}
      CS_DB_PASSWORD: ${CS_DB_PASSWORD:?set CS_DB_PASSWORD}
      CS_DATABASES: ${CS_DATABASES:?set CS_DATABASES}
      CS_DEV_MARKER_DB: ${CS_DEV_MARKER_DB:-}
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    <<: *app
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"

  worker:
    <<: *app
    user: www-data
    init: true
    entrypoint: ["/usr/local/bin/connectstats-worker"]
    environment:
      <<: *email-env
      CRONTAB: ${CRONTAB:-/var/www/html/prod/docker/worker/crontab}
      QUEUE_CHECK_INTERVAL: ${QUEUE_CHECK_INTERVAL:-60}
      # healthchecks.io ping key for the scheduled jobs (docker/worker/cronjob.sh);
      # empty = jobs run without pings.
      HEALTHCHECKSIO_PING_KEY: ${HEALTHCHECKSIO_PING_KEY:-}
    # The php:apache base image sets STOPSIGNAL SIGWINCH (Apache graceful stop); the
    # worker's shutdown handler listens for SIGTERM. Let running tasks finish when
    # stopping (cutover, deploys).
    stop_signal: SIGTERM
    stop_grace_period: 120s

volumes:
  tmp:
