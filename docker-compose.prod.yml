# Droplet overlay: TLS with Caddy in front of `app`.
# Enabled by COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml (see .env.prod.sample).

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:?set SITE_ADDRESSES}
      UPSTREAM: ${UPSTREAM:-app:80}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Static site outside /prod (redirects, apple-app-site-association, favicons):
      # deployment-specific, see the Caddyfile. Empty dir = 404 for those paths.
      - ${SITE_DIR:-${DATA_DIR}/site}:/srv/site:ro
      # Certificates on the Volume, so a rebuild doesn't re-issue them (rate limits).
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
